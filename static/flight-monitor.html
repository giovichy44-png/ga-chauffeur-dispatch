<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight monitoring | GA Dispatch</title><style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:20px;background:#17201b;color:#f4f2e9}label{display:block;margin:14px 0}input,button{font:inherit;padding:12px;box-sizing:border-box;width:100%}button{cursor:pointer;background:#c9b894;border:0}a{color:#c9b894}pre{white-space:pre-wrap}</style></head><body><a href="/">← Dispatch</a><h1>Flight monitoring</h1><p>Free plan: up to three flights per month. Choose the bookings you want to monitor. All other flights require a manual airline or airport check.</p><form id="monitor"><label>Booking ID<input name="booking_id" required placeholder="BK-1234"></label><label>Airline code<input name="carrier" required placeholder="BA" maxlength="3"></label><label>Flight number (without airline code)<input name="flight_number" required placeholder="123"></label><label>Local departure date at origin<input name="departure_date" type="date" required></label><label>Departure airport IATA code<input name="origin" required placeholder="JFK" maxlength="3"></label><label>Arrival airport IATA code<input name="destination" required placeholder="LHR" maxlength="3"></label><button>Start free monitoring</button></form><p id="status" role="status"></p><h2>Monitored bookings</h2><pre id="watches"></pre><script>
const form=document.querySelector('form'),status=document.querySelector('#status');
async function refresh(){const r=await fetch('/api/flight-monitor');const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in to dispatch');document.querySelector('#watches').textContent=(d.watches||[]).map(w=>`${w.booking_id}: ${w.state}\n${w.flight_status}`).join('\n\n')||'No monitored flights.';if(!d.connected)status.textContent='FlightByte Free is not connected yet.';}
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/flight-monitor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent='Monitoring '+d.state;await refresh();}catch(e){status.textContent=e.message;}finally{button.disabled=false;}});refresh().catch(e=>status.textContent=e.message);
</script></body></html>
