<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Private route checks</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}input,select,button{font:inherit;padding:10px;margin:8px;width:90%}pre{white-space:pre-wrap}</style><a href="/">Dispatch</a><h1>Private route verification</h1><p>Read-only route and pricing check. No booking or payment is created.</p><form id="check"><label>Pickup<input name="pickup" required value="The Savoy, Strand, London WC2R 0EZ"></label><label>Drop-off<input name="dropoff" required value="Heathrow Airport Terminal 5, Hounslow TW6 2GA"></label><input name="vehicle" value="mercedes_s_class" hidden><input name="service" value="Point-to-point transfer" hidden><button>Check route</button></form><pre id="result"></pre><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let out=document.querySelector('pre');out.textContent='Checking Google route…';try{let r=await fetch('/api/quote-preview?'+new URLSearchParams(new FormData(e.target)));let q=await r.json();if(q.path){q.road_geometry_points=q.path.length;delete q.path}out.textContent=JSON.stringify(q,null,2)}catch(e){out.textContent='Unable to complete check.'}};</script></html>
