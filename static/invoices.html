<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoicing · GA Chauffeur Services</title>
<meta name="theme-color" content="#17211c">
<meta name="apple-mobile-web-app-title" content="GA Invoicing">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/invoices-app.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/invoices-icon-180.png">
<link rel="icon" type="image/png" href="/invoices-icon-192.png">
<link rel="stylesheet" href="/invoices.css?v=4">
<script defer src="/invoices.js?v=8"></script>
</head>
<body>
<header>
  <img src="/assets/ga-logo.png" width="195" alt="GA Chauffeur Services">
  <div class="app-links"><button id="install-invoicing" type="button" hidden>Install app</button><a href="/">Back to Dispatch</a></div>
</header>
<main>
  <div class="heading"><h1>Invoicing</h1><button id="new" type="button">New invoice</button></div>
  <nav aria-label="Invoicing sections">
    <button data-view="invoices" aria-pressed="true">Invoices</button>
    <button data-view="clients" aria-pressed="false">Clients</button>
    <button data-view="items" aria-pressed="false">Items</button>
    <button data-view="settings" aria-pressed="false">Payment details</button>
  </nav>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="invoices">
    <label class="search">Find an invoice <input id="search" type="search" placeholder="Invoice number, client or status"></label>
    <label class="check"><input id="show-deleted-invoices" type="checkbox"> Show deleted invoices</label>
    <div id="invoice-list"></div>
  </section>
  <section id="clients" hidden>
    <form id="client-form" class="card">
      <h2>Client details</h2>
      <input type="hidden" name="id">
      <div class="fields"><label>Name or company<input name="name" required maxlength="500"></label>
      <label>Billing email<input name="email" type="email" maxlength="254"></label></div>
      <label>Billing address<textarea name="address" maxlength="1500" rows="3"></textarea></label>
      <div class="actions"><button>Save client</button><button type="reset" class="secondary">Clear</button></div>
    </form>
    <details class="card"><summary>Import clients</summary>
      <form id="client-import">
        <label>Client export JSON<textarea name="client_export" required rows="4" spellcheck="false"></textarea></label>
        <button>Import clients</button>
      </form>
    </details>
    <div class="client-filters">
      <label>Find a client<input id="client-search" type="search" placeholder="Name or billing email"></label>
      <label>Sort by name<select id="client-sort"><option value="asc">A to Z</option><option value="desc">Z to A</option></select></label>
      <label class="check"><input id="show-deleted-clients" type="checkbox"> Show deleted clients</label>
    </div>
    <div id="client-list"></div>
  </section>
  <section id="items" hidden>
    <form id="item-form" class="card">
      <h2>Item details</h2>
      <input type="hidden" name="id">
      <div class="fields"><label>Description<input name="description" required maxlength="500"></label>
      <label>Unit price (£)<input name="unit_price" type="number" min="0" max="1000000" step="0.01" required></label></div>
      <div class="actions"><button>Save item</button><button type="reset" class="secondary">Clear</button></div>
    </form>
    <div id="item-list"></div>
  </section>
  <section id="settings" hidden>
    <form id="payment-settings" class="card">
      <h2>Payment details</h2>
      <div class="fields"><label>Account name<input name="account_name"></label><label>Sort code<input name="sort_code"></label>
      <label>Account number<input name="account_number"></label><label>BIC<input name="bic"></label>
      <label>IBAN<input name="iban"></label><label>VAT registration<input name="vat_number"></label></div>
      <label>Optional SumUp or Stripe URL<input name="card_link" type="url" placeholder="Use Dispatch Stripe Checkout if left blank"></label>
      <label>Import payment details<input type="file" id="payment-details-file" accept="application/json,.json"></label>
      <div class="actions"><button type="submit">Save payment details</button></div>
    </form>
  </section>
  <section id="invoice-preview" hidden>
    <div class="card">
      <h2 id="preview-title">Invoice preview</h2>
      <div id="preview-actions" class="actions"></div>
      <p id="invoice-card-payment-note" hidden>Card payment links are included on emailed invoices when card payments are enabled.</p>
      <iframe id="preview-pdf" title="Invoice PDF"></iframe>
      <div id="preview-footer" class="actions" style="justify-content:flex-end;margin-top:12px"></div>
    </div>
  </section>
  <dialog id="payment-dialog">
    <form id="payment-form" method="dialog">
      <h2>Record payment or deduction</h2><input type="hidden" name="id">
      <p id="payment-balance"></p>
      <label>Type<select name="kind"><option value="payment">Payment received</option><option value="deduction">Deduction</option></select></label>
      <label>Amount (£)<input name="amount" type="number" min="0.01" step="0.01" required></label>
      <label>Reference or reason<input name="memo" maxlength="250"></label>
      <div class="actions"><button type="submit">Record amount</button><button id="payment-cancel" type="button" class="secondary">Cancel</button></div>
    </form>
  </dialog>
  <section id="editor" hidden>
    <form class="card" id="invoice-form">
      <h2 id="editor-title">New invoice</h2>
      <input type="hidden" name="id">
      <div class="fields"><label>Bill to<select name="client_id" required></select></label>
      <label>Invoice date<input name="issued" type="date" required></label>
      <label>Payment terms<select name="terms_days" required>
        <option value="0">Same day</option><option value="1">1 day</option><option value="7">7 days</option>
        <option value="30">30 days</option><option value="custom" hidden>Existing terms</option>
      </select><small id="invoice-due-label"></small></label><input name="due" type="hidden"></div>
      <h3>Charges</h3>
      <div id="lines"></div>
      <div class="actions"><button id="add-line" type="button" class="secondary">Add line item</button>
        <label class="catalog">Use saved item<select id="catalog"></select></label></div>
      <div class="fields"><label>Discount (£)<input name="discount" type="number" min="0" step="0.01" value="0"></label>
      <label class="check"><input id="include-vat" type="checkbox"> Include VAT</label>
      <label id="vat-field" hidden>VAT rate (%)<input name="vat_percent" type="number" min="0" max="100" step="0.01" value="20"></label></div>
      <p id="total" aria-live="polite"></p>
      <label>Comments and payment instructions<textarea name="comments" maxlength="3000" rows="4"></textarea></label>
      <div class="actions invoice-create-actions">
        <button type="submit" id="create-invoice">Create invoice and view PDF</button>
        <button type="button" class="secondary" data-view="invoices">Back to invoices</button>
      </div><p id="editor-feedback" role="status"></p>
    </form>
  </section>
</main>
<template id="line-template"><div class="line">
  <label>Description<input name="description" required maxlength="500"></label>
  <label>Quantity<input name="quantity" type="number" min="0.001" max="10000" step="0.001" value="1" required></label>
  <label>Rate (£)<input name="unit_price" type="number" min="0" max="1000000" step="0.01" required></label>
  <button type="button" class="secondary remove" aria-label="Remove line item">Remove</button>
</div></template>
</body>
</html>
