services:
  - type: web
    name: ga-chauffeur-dispatch
    env: python
    domains:
      - dispatch.gachauffeurs.co.uk
      - gachauffeurs.co.uk
      - www.gachauffeurs.co.uk
    buildCommand: "python3 db.py"
    startCommand: "python3 server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FROM_EMAIL
        value: enquiries@gachauffeurs.co.uk
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
